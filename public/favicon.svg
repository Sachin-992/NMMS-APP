<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Shield Badge -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" />

  <!-- Academic Graduation Cap -->
  <path d="M64 28 L104 46 L64 64 L24 46 Z" fill="url(#goldGrad)" />
  <path d="M40 54.5 V72 C40 82 88 82 88 72 V54.5" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  <path d="M96 49.5 V74" fill="none" stroke="#FCD34D" stroke-width="3" stroke-linecap="round" />
  <circle cx="96" cy="76" r="4" fill="#FCD34D" />

  <!-- NMMS Bold Text -->
  <text x="64" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="1">NMMS</text>
</svg>